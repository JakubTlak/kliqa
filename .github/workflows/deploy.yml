name: Wdrożenie na kliqa.pl

# Buduje serwis z katalogu prototyp/ i wysyła gotowe pliki na hosting przez FTP.
# Uruchamia się po każdym pushu na main oraz ręcznie z zakładki Actions.
#
# Zanim zadziała, ustaw w repozytorium (Settings → Secrets and variables → Actions):
#   FTP_SERVER    host FTP z panelu SeoHost, np. ftp.kliqa.pl
#   FTP_USERNAME  login konta FTP — w DirectAdmin konta dodatkowe mają postać login@kliqa.pl
#                 (sam login działa tylko dla głównego konta panelu)
#   FTP_PASSWORD  hasło konta FTP
#   FTP_DIR       katalog docelowy, np. /domains/kliqa.pl/public_html/
#
# Hasło trafia wyłącznie do sekretów GitHuba — nie zapisuj go w plikach repozytorium.

on:
  push:
    branches: [main]
    paths:
      - 'prototyp/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-kliqa
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zbuduj wersję na hosting
        run: |
          node tools/build.js deploy
          echo "--- zawartość deploy/ ---"
          find deploy -type f | sort

      - name: Sprawdź, czy build się nie rozjechał
        run: |
          test -f deploy/index.html
          test -f deploy/kontakt.php
          test -f deploy/.htaccess
          test -f deploy/assets/terrain.b64.txt
          test -f deploy/404.html
          test -f deploy/favicon.ico
          test -f deploy/robots.txt
          test -f deploy/site.webmanifest
          test -f deploy/assets/kliqa.js
          test "$(find deploy/assets/fonts -name "*.woff2" | wc -l)" -eq 4
          test "$(find deploy -name index.html | wc -l)" -eq 17
          # adres kanoniczny musi kończyć się ukośnikiem — dokładnie tak serwuje go hosting
          grep -q 'canonical" href="https://kliqa.pl/uslugi/"' deploy/uslugi/index.html
          grep -q '<loc>https://kliqa.pl/edukacja/consent-mode-v2/</loc>' deploy/sitemap.xml
          grep -q '<loc>https://kliqa.pl/polityka-prywatnosci/</loc>' deploy/sitemap.xml
          # strona błędu nie może trafić do indeksu ani udawać strony głównej
          grep -q 'noindex' deploy/404.html
          grep -q 'data-trasa="/404"' deploy/404.html
          # żadna strona nie może już wozić skryptów w treści
          test "$(grep -c "<script" deploy/index.html)" -eq 3
          echo "OK — 17 podstron, strona błędu, zasoby i pliki serwera na miejscu"

      - name: Wyślij na serwer przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./deploy/
          # Szyfrowane połączenie — przy zwykłym ftp hasło leci przez internet otwartym tekstem.
          # Gdyby serwer nie wspierał TLS, w logu pojawi się błąd uzgadniania: wtedy 'ftp'.
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
