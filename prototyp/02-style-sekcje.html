<style>
.sec{padding-block:var(--sec)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform .7s cubic-bezier(.22,.61,.36,1)}
.rv.in{opacity:1;transform:none}

/* ---------- segmenty ---------- */
.seg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--graphite);border:1px solid var(--graphite)}
.seg{background:var(--carbon);padding:34px 30px 30px;position:relative;display:flex;flex-direction:column;gap:14px;min-height:262px;transition:background .25s ease;text-decoration:none}
.seg:hover{background:var(--onyx)}
.seg-n{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--fog)}
.seg h3{font-family:var(--serif);font-weight:300;font-size:25px;line-height:1.1;color:var(--chalk);margin:0;letter-spacing:-.01em}
.seg p{margin:0;color:var(--ash);font-size:14px;line-height:1.6}
.seg-tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;padding-top:16px}
.seg:hover .tag{border-color:var(--slate);color:var(--pearl)}
.seg-bar{position:absolute;left:0;top:0;height:2px;width:0;background:var(--lime);transition:width .35s ease}
.seg:hover .seg-bar{width:100%}
.seg-more{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog);transition:color .2s ease;margin-top:14px}
.seg:hover .seg-more{color:var(--lime)}
@media(max-width:900px){.seg-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.seg-grid{grid-template-columns:1fr}.seg{min-height:0}}

/* ---------- droga współpracy: pionowy zygzak z kropek ---------- */
.pz{position:relative;padding-block:var(--sec);border-block:1px solid var(--graphite);background:var(--void);
  background-image:radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px);background-size:28px 28px}
.pz-track{position:relative;margin-top:clamp(40px,6vw,72px)}
.pz-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pz-steps{display:flex;flex-direction:column;gap:clamp(48px,7vw,104px);position:relative;z-index:1}
.pz-step{display:grid;grid-template-columns:1fr clamp(120px,17vw,260px) 1fr;align-items:center;gap:0}
.pz-card{
  background:var(--onyx);border:1px solid var(--graphite);padding:clamp(22px,2.4vw,30px);
  transition:border-color .4s ease,transform .4s ease,background .4s ease;
  opacity:.55;transform:translateY(10px);
}
.pz-step.on .pz-card{opacity:1;transform:none;border-color:var(--slate);background:#191919}
.pz-step:nth-child(odd) .pz-card{grid-column:1}
.pz-step:nth-child(even) .pz-card{grid-column:3}
.pz-step:nth-child(odd) .pz-mid{grid-column:2}
.pz-step:nth-child(even) .pz-mid{grid-column:2}
.pz-mid{display:flex;align-items:center;height:100%}
.pz-step:nth-child(odd) .pz-mid{justify-content:flex-start}
.pz-step:nth-child(even) .pz-mid{justify-content:flex-end}
.pz-node{position:relative;width:15px;height:15px;border-radius:50%;background:var(--carbon);border:1px solid var(--fog);transition:all .4s ease}
.pz-step.on .pz-node{background:var(--lime);border-color:var(--lime);box-shadow:0 0 0 5px rgba(197,255,74,.12),var(--glow);transform:scale(1.2)}
.pz-step.past .pz-node{background:var(--olive);border-color:var(--olive)}
.pz-meta{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fog);margin:0 0 12px;transition:color .4s ease}
.pz-step.on .pz-meta{color:var(--lime)}
.pz-card h3{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.4vw,38px);line-height:1.05;letter-spacing:-.02em;color:var(--chalk);margin:0 0 12px}
.pz-card p{margin:0;color:var(--bone);font-size:14.5px;line-height:1.7}
.pz-out{margin-top:20px;padding-top:16px;border-top:1px solid var(--graphite);display:flex;flex-direction:column;gap:9px}
.pz-out li{display:flex;gap:10px;color:var(--ash);font-size:13px;line-height:1.5}
.pz-out li i{color:var(--lime);font-style:normal;flex:none}
.pz-out ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.pz-num{position:absolute;top:-34px;left:0;font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--fog)}
.pz-card{position:relative}
@media(max-width:900px){
  .pz-step{grid-template-columns:44px 1fr}
  .pz-step:nth-child(odd) .pz-card,.pz-step:nth-child(even) .pz-card{grid-column:2}
  .pz-step:nth-child(odd) .pz-mid,.pz-step:nth-child(even) .pz-mid{grid-column:1;align-items:flex-start;justify-content:center;padding-top:26px}
}

/* ---------- usługi ---------- */
.sv-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:56px}
.sv-nav a{border:1px solid var(--iron);border-radius:2px;padding:8px 13px;text-decoration:none;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke);transition:all .2s ease}
.sv-nav a:hover{border-color:var(--lime);color:var(--lime)}
.sv-block{padding-block:clamp(44px,6vw,72px);border-top:1px solid var(--graphite);content-visibility:auto;contain-intrinsic-size:auto 820px}
.sv-block:first-of-type{border-top:0}
.sv-top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:22px}
.sv-body{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,64px);align-items:start}
.sv-col h4{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fog);margin:0 0 14px;font-weight:500}
.sv-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.sv-col li{position:relative;padding-left:18px;color:var(--bone);font-size:13.5px;line-height:1.55}
.sv-col li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:1px;background:var(--lime)}
.sv-kpi{margin-top:22px;padding-top:16px;border-top:1px solid var(--graphite);font-family:var(--mono);font-size:11px;color:var(--smoke);letter-spacing:.04em;line-height:1.7}
.sv-kpi b{color:var(--lime);font-weight:500}
@media(max-width:820px){.sv-body{grid-template-columns:1fr}.sv-top{flex-direction:column;gap:10px}}

/* ---------- widgety w usługach ---------- */
.widget{margin-top:34px;border:1px solid var(--graphite);background:var(--onyx);border-radius:2px;overflow:hidden}
.w-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;border-bottom:1px solid var(--graphite);background:var(--graphite)}
.w-title{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--pearl)}
.w-sim{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--fog);border:1px solid var(--iron);border-radius:2px;padding:3px 7px}
.w-body{padding:clamp(18px,2.2vw,26px)}
.w-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,2.6vw,34px)}
@media(max-width:820px){.w-cols{grid-template-columns:1fr}}
.w-lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fog);margin:0 0 10px}
.w-slider{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.w-slider .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--bone)}
.w-slider .row b{font-family:var(--mono);color:var(--lime);font-weight:500;font-size:12px}
input[type=range]{width:100%;accent-color:var(--lime);background:transparent;cursor:pointer;height:18px}
.w-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--graphite);border:1px solid var(--graphite);margin-top:6px}
.w-kpi{background:var(--carbon);padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.w-kpi span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog)}
.w-kpi b{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--chalk);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.w-kpi b.good{color:var(--lime)}
.w-kpi b.warn{color:#ffb84a}
.w-kpi b.bad{color:#ff6b6b}
.w-chart{display:flex;align-items:flex-end;gap:5px;height:132px;padding-top:8px;border-bottom:1px solid var(--graphite)}
.w-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;height:100%}
.w-col .bar{background:var(--olive);transition:height .45s cubic-bezier(.22,.61,.36,1);min-height:2px}
.w-col .bar.hi{background:var(--lime);box-shadow:0 0 10px rgba(197,255,74,.35)}
.w-xaxis{display:flex;gap:5px;margin-top:8px}
.w-xaxis span{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--fog);letter-spacing:.06em}
.w-toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.w-chip{border:1px solid var(--iron);background:transparent;border-radius:2px;padding:8px 12px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);transition:all .2s ease;user-select:none}
.w-chip:hover{border-color:var(--fog);color:var(--bone)}
.w-chip.on{border-color:var(--lime);color:var(--lime);box-shadow:var(--glow)}
.w-gauge{margin-bottom:14px}
.w-gauge .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:12.5px;color:var(--bone)}
.w-gauge .row b{font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.w-track{height:6px;background:var(--graphite);border-radius:2px;overflow:hidden;position:relative}
.w-fill{height:100%;background:var(--lime);width:0;transition:width .5s cubic-bezier(.22,.61,.36,1)}
.w-fill.warn{background:#ffb84a}
.w-fill.bad{background:#ff6b6b}
.w-thresh{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--slate)}
.w-serp{display:flex;flex-direction:column;gap:1px;background:var(--graphite);border:1px solid var(--graphite)}
.w-serp-row{background:var(--carbon);padding:12px 14px;transition:all .3s ease}
.w-serp-row.ai{background:#12160b;border-left:2px solid var(--lime)}
.w-serp-row .u{font-family:var(--mono);font-size:10px;color:var(--olive);letter-spacing:.04em}
.w-serp-row .t{font-size:14px;color:var(--pearl);margin-top:3px}
.w-serp-row.ai .t{color:var(--chalk)}
.w-serp-row .d{font-size:11.5px;color:var(--fog);margin-top:3px;line-height:1.5}
.w-serp-row.dim{opacity:.42}
.w-flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.w-node{flex:1;min-width:104px;border:1px solid var(--iron);background:var(--carbon);padding:12px 10px;text-align:center;transition:all .3s ease;position:relative}
.w-node.hot{border-color:var(--lime);background:#141a0c;box-shadow:var(--glow)}
.w-node .n{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog);display:block;margin-bottom:6px}
.w-node .v{font-size:12.5px;color:var(--bone);line-height:1.35}
.w-node.hot .v{color:var(--chalk)}
.w-arrow{display:flex;align-items:center;justify-content:center;width:22px;color:var(--iron);font-family:var(--mono);font-size:12px}
.w-arrow.hot{color:var(--lime)}
.w-out{margin-top:16px;background:var(--void);border:1px solid var(--graphite);padding:16px;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--pearl);white-space:pre-wrap;min-height:96px}
.w-out em{color:var(--lime);font-style:normal}
.w-btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--lime);background:transparent;color:var(--lime);border-radius:var(--r-btn);padding:10px 18px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;box-shadow:var(--glow);transition:background .2s ease}
.w-btn:hover{background:rgba(197,255,74,.1)}
.w-btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.w-hooks{display:flex;flex-direction:column;gap:8px}
.w-hook{display:flex;align-items:center;gap:12px;border:1px solid var(--iron);background:var(--carbon);padding:10px 12px;cursor:pointer;transition:all .25s ease;text-align:left;width:100%}
.w-hook:hover{border-color:var(--fog)}
.w-hook.on{border-color:var(--lime);background:#141a0c}
.w-hook .txt{flex:1;font-size:13px;color:var(--bone);line-height:1.4}
.w-hook .score{font-family:var(--mono);font-size:12px;color:var(--fog);font-variant-numeric:tabular-nums}
.w-hook.on .score{color:var(--lime)}
.w-note{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--fog);line-height:1.7}

/* ---------- o nas ---------- */
.ab-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,72px);align-items:start}
.ab-copy p{color:var(--bone);font-size:15px;line-height:1.75;margin:0 0 18px;max-width:62ch}
.ab-quote{border-left:2px solid var(--lime);padding:6px 0 6px 20px;margin:26px 0;font-family:var(--serif);font-weight:300;font-style:italic;font-size:23px;line-height:1.35;color:var(--chalk)}
.ab-panel{background:var(--onyx);border:1px solid var(--graphite);padding:clamp(24px,3vw,32px)}
.ab-panel h3{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ash);margin:0 0 20px;font-weight:500}
.ab-row{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--graphite)}
.ab-row:first-of-type{border-top:0;padding-top:0}
.ab-k{font-family:var(--mono);font-size:24px;color:var(--lime);line-height:1;min-width:82px;font-variant-numeric:tabular-nums}
.ab-v strong{display:block;color:var(--chalk);font-weight:500;font-size:14px;margin-bottom:3px}
.ab-v span{color:var(--ash);font-size:13px;line-height:1.5}
.rule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--graphite);border:1px solid var(--graphite)}
.rule{background:var(--carbon);padding:30px;display:flex;flex-direction:column;gap:12px}
.rule-n{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--lime)}
.rule h3{font-family:var(--serif);font-weight:300;font-size:24px;line-height:1.15;color:var(--chalk);margin:0}
.rule p{margin:0;color:var(--ash);font-size:13.5px;line-height:1.6}
.no-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:0;padding:0;list-style:none}
.no-list li{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--graphite);background:var(--onyx);padding:18px 20px;color:var(--bone);font-size:14px;line-height:1.55}
.no-list li b{color:var(--chalk);font-weight:500}
.no-x{color:var(--lime);font-family:var(--mono);flex:none;font-size:13px;line-height:1.4}
.stack-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px}
.stack-col h4{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fog);margin:0 0 12px;font-weight:500}
.stack-col div{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:900px){.ab-grid,.rule-grid{grid-template-columns:1fr}.no-list{grid-template-columns:1fr}}

/* ---------- edukacja ---------- */
.edu-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.chip{background:transparent;border:1px solid var(--iron);border-radius:2px;padding:7px 13px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke);transition:all .2s ease}
.chip:hover{border-color:var(--fog);color:var(--bone)}
.chip.on{border-color:var(--lime);color:var(--lime);box-shadow:var(--glow)}
.edu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--graphite);border:1px solid var(--graphite)}
.edu-card{background:var(--carbon);padding:28px;display:flex;flex-direction:column;gap:12px;text-decoration:none;transition:background .25s ease;cursor:pointer;text-align:left;border:0;font:inherit}
.edu-card:hover{background:var(--onyx)}
.edu-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.edu-cat{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.edu-yr{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--fog)}
.edu-card h3{font-family:var(--serif);font-weight:300;font-size:23px;line-height:1.2;color:var(--chalk);margin:0;letter-spacing:-.01em}
.edu-card p{margin:0;color:var(--ash);font-size:13.5px;line-height:1.6}
.edu-src{margin-top:auto;padding-top:16px;border-top:1px solid var(--graphite);display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);width:100%}
.edu-card:hover .edu-src{color:var(--pearl)}
.edu-go{color:var(--lime);white-space:nowrap}
.edu-card[hidden]{display:none}
@media(max-width:820px){.edu-grid{grid-template-columns:1fr}}

/* ---------- artykuł edukacyjny ---------- */
.art{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(32px,5vw,64px);align-items:start}
.art-body h2{font-family:var(--serif);font-weight:300;font-size:clamp(24px,3vw,32px);line-height:1.15;color:var(--chalk);margin:44px 0 14px;letter-spacing:-.015em}
.art-body h2:first-child{margin-top:0}
.art-body p{color:var(--bone);font-size:15.5px;line-height:1.8;margin:0 0 18px;max-width:68ch}
.art-body ul{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.art-body ul li{position:relative;padding-left:20px;color:var(--bone);font-size:14.5px;line-height:1.65;max-width:66ch}
.art-body ul li::before{content:"";position:absolute;left:0;top:11px;width:8px;height:1px;background:var(--lime)}
.art-body strong{color:var(--chalk);font-weight:500}
.art-quote{border-left:2px solid var(--lime);padding:8px 0 8px 22px;margin:28px 0;font-family:var(--serif);font-weight:300;font-style:italic;font-size:21px;line-height:1.4;color:var(--chalk)}
.art-aside{position:sticky;top:96px;display:flex;flex-direction:column;gap:18px}
.art-nums{border:1px solid var(--graphite);background:var(--onyx);padding:22px}
.art-nums h3{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fog);margin:0 0 16px;font-weight:500}
.art-num{padding:12px 0;border-top:1px solid var(--graphite)}
.art-num:first-of-type{border-top:0;padding-top:0}
.art-num b{display:block;font-family:var(--mono);font-size:22px;color:var(--lime);line-height:1.1;font-variant-numeric:tabular-nums}
.art-num span{display:block;font-size:12.5px;color:var(--ash);line-height:1.5;margin-top:4px}
.art-srcbox{border:1px solid var(--graphite);background:var(--onyx);padding:22px}
.art-srcbox h3{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fog);margin:0 0 12px;font-weight:500}
.art-srcbox p{margin:0 0 16px;color:var(--ash);font-size:13px;line-height:1.6}
.art-foot{margin-top:44px;padding-top:26px;border-top:1px solid var(--graphite);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
@media(max-width:900px){.art{grid-template-columns:1fr}.art-aside{position:static}}

/* ---------- pasek CTA ---------- */
.cta-band{border-top:1px solid var(--graphite);background:var(--void)}
.cta-in{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap;padding-block:clamp(48px,7vw,80px)}
.cta-in .h2{max-width:18ch}

/* ---------- kontakt ---------- */
.ct{background:var(--void);border-top:1px solid var(--graphite)}
.ct-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(32px,5vw,72px);align-items:start}
.ct-side p{color:var(--ash);font-size:14.5px;line-height:1.7;max-width:44ch;margin:0}
.ct-mail{display:inline-flex;align-items:center;gap:10px;margin-top:26px;font-family:var(--mono);font-size:15px;color:var(--lime);text-decoration:none;border-bottom:1px solid rgba(197,255,74,.35);padding-bottom:4px}
