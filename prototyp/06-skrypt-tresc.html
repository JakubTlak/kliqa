(function(){
'use strict';
var K = window.KLIQA, clamp = K.clamp, REDUCED = K.REDUCED;
var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

/* ============================================================ 1. DROGA WSPÓŁPRACY (zygzak) */
(function(){
  var track = document.getElementById('pzTrack');
  if(!track) return;
  var svg = document.getElementById('pzSvg');
  var base = document.getElementById('pzBase'), fill = document.getElementById('pzFill');
  var clipRect = document.getElementById('pzClipRect');
  var steps = Array.prototype.slice.call(track.querySelectorAll('.pz-step'));
  var prog = document.getElementById('pzProg');
  var pts = [], trackH = 0, active = -1;

  function measure(){
    var tr = track.getBoundingClientRect();
    trackH = tr.height;
    svg.setAttribute('viewBox', '0 0 ' + Math.round(tr.width) + ' ' + Math.round(tr.height));
    svg.setAttribute('width', Math.round(tr.width));
    svg.setAttribute('height', Math.round(tr.height));
    clipRect.setAttribute('width', Math.round(tr.width) + 40);
    pts = steps.map(function(st){
      var n = st.querySelector('.pz-node').getBoundingClientRect();
      return [ (n.left + n.width/2 - tr.left), (n.top + n.height/2 - tr.top) ];
    });
    // Zygzak zaczyna się nad pierwszym węzłem i kończy pod ostatnim.
    var full = [[pts[0][0], 0]].concat(pts).concat([[pts[pts.length-1][0], tr.height]]);
    var s = full.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
    base.setAttribute('points', s);
    fill.setAttribute('points', s);
  }
  function update(){
    if(track.offsetParent === null) return;
    if(!pts.length || Math.abs(track.getBoundingClientRect().height - trackH) > 2) measure();
    var tr = track.getBoundingClientRect();
    var line = window.innerHeight * 0.58;              // linia „teraz” w kadrze
    var y = clamp(line - tr.top, 0, tr.height);
    clipRect.setAttribute('height', y.toFixed(1));
    var idx = -1;
    for(var i=0;i<pts.length;i++) if(pts[i][1] <= y) idx = i;
    if(idx !== active){
      active = idx;
      steps.forEach(function(st,k){
        st.classList.toggle('on', k === idx);
        st.classList.toggle('past', k < idx);
      });
      if(prog) prog.textContent = ('0'+Math.max(1, idx+1)).slice(-2);
    }
  }
  K.onScrollAdd(update);
  window.addEventListener('resize', function(){ pts = []; update(); });
  if(window.ResizeObserver) new ResizeObserver(function(){ pts = []; update(); }).observe(track);
  setTimeout(update, 60);
  setTimeout(update, 600);
})();

/* --- 2a. alokacja budżetu --- */
(function(){
  var w = document.querySelector('[data-w="perf"]');
  if(!w) return;
  var BUD = 30000;
  var CH = {
    google: { k: 3.2, a: 0.78, rev: 240 },
    meta:   { k: 3.6, a: 0.70, rev: 210 },
    tiktok: { k: 3.9, a: 0.62, rev: 180 }
  };
  var inputs = Array.prototype.slice.call(w.querySelectorAll('input[type=range]'));
  var chart = w.querySelector('[data-chart]');
  var bars = [];
  for(var i=0;i<12;i++){
    var col = document.createElement('div');
    col.className = 'w-col';
    var bar = document.createElement('div');
    bar.className = 'bar';
    col.appendChild(bar); chart.appendChild(col);
    bars.push(bar);
  }
  function normalize(changed){
    var total = inputs.reduce(function(s,i){ return s + (+i.value); }, 0);
    if(total === 0){ changed.value = 100; return; }
    var rest = inputs.filter(function(i){ return i !== changed; });
    var restSum = rest.reduce(function(s,i){ return s + (+i.value); }, 0);
    var left = 100 - (+changed.value);
    rest.forEach(function(i){
      i.value = restSum > 0 ? Math.round(left * (+i.value) / restSum) : Math.round(left / rest.length);
    });
    var diff = 100 - inputs.reduce(function(s,i){ return s + (+i.value); }, 0);
    if(diff !== 0 && rest.length) rest[0].value = clamp(+rest[0].value + diff, 0, 100);
  }
  function compute(){
    var conv = 0, rev = 0;
    inputs.forEach(function(i){
      var c = CH[i.getAttribute('data-ch')];
      var b = BUD * (+i.value) / 100;
      var n = b > 0 ? c.k * Math.pow(b/100, c.a) : 0;
      conv += n; rev += n * c.rev;
      w.querySelector('[data-v="'+i.getAttribute('data-ch')+'"]').textContent = i.value + '%';
    });
    var cac = conv > 0 ? BUD/conv : 0;
    w.querySelector('[data-k="conv"]').textContent = Math.round(conv).toLocaleString('pl-PL');
    w.querySelector('[data-k="cac"]').textContent = Math.round(cac) + ' zł';
    var roasEl = w.querySelector('[data-k="roas"]');
    var roas = rev/BUD;
    roasEl.textContent = roas.toFixed(2) + '×';
    roasEl.className = roas >= 2.2 ? 'good' : (roas >= 1.6 ? '' : 'warn');
    // Nauka systemu: pierwsze tygodnie słabsze, potem plateau. Stały wzorzec, nie losowy szum.
    var shape = [0.58,0.66,0.74,0.8,0.86,0.9,0.94,0.97,1,1.02,1.03,1.05];
    var peak = conv/12 * 1.05;
    bars.forEach(function(b,idx){
      var v = conv/12 * shape[idx];
      b.style.height = clamp(v/peak*100, 3, 100).toFixed(1) + '%';
      b.classList.toggle('hi', idx >= 8);
    });
  }
  inputs.forEach(function(i){
    i.addEventListener('input', function(){ normalize(i); compute(); });
  });
  compute();
})();

/* --- 2b. Core Web Vitals --- */
(function(){
  var w = document.querySelector('[data-w="vitals"]');
  if(!w) return;
  var FIX = {
    builder:{lcp:1.5,inp:60,cls:0.08,kb:1200},
    img:{lcp:0.7,inp:0,cls:0.09,kb:700},
    js:{lcp:0.5,inp:150,cls:0.04,kb:480},
    font:{lcp:0.3,inp:20,cls:0.06,kb:120},
    sgtm:{lcp:0.2,inp:60,cls:0,kb:180}
  };
  var chips = Array.prototype.slice.call(w.querySelectorAll('[data-fix]'));
  var on = {};
  function set(el, val, unit, good, warn, max, fillSel){
    w.querySelector('[data-g="'+el+'"]').textContent = val.toFixed(el==='cls'?2:(el==='lcp'?1:0)) + unit;
    var cls = val <= good ? 'good' : (val <= warn ? 'warn' : 'bad');
    w.querySelector('[data-g="'+el+'"]').className = cls;
    var f = w.querySelector('[data-f="'+fillSel+'"]');
    f.style.width = clamp(val/max*100, 2, 100).toFixed(1) + '%';
    f.className = 'w-fill' + (cls === 'good' ? '' : ' ' + cls);
    return cls;
  }
  function compute(){
    var lcp = 4.6, inp = 420, cls = 0.29, kb = 3200;
    Object.keys(on).forEach(function(k){
      if(!on[k]) return;
      lcp -= FIX[k].lcp; inp -= FIX[k].inp; cls -= FIX[k].cls; kb -= FIX[k].kb;
    });
    lcp = Math.max(1.1, lcp); inp = Math.max(90, inp); cls = Math.max(0.01, cls); kb = Math.max(420, kb);
    var c1 = set('lcp', lcp, ' s', 2.5, 4.0, 4.0, 'lcp');
    var c2 = set('inp', inp, ' ms', 200, 500, 400, 'inp');
    var c3 = set('cls', cls, '', 0.1, 0.25, 0.25, 'cls');
    var cr = 1.1 + Math.max(0, 4.6-lcp)*0.18 + (inp<=200?0.15:0) + (cls<=0.1?0.12:0);
    w.querySelector('[data-g="kb"]').textContent = Math.round(kb) + ' KB';
    var crEl = w.querySelector('[data-g="cr"]');
    crEl.textContent = cr.toFixed(2) + '%';
    crEl.className = cr >= 1.7 ? 'good' : '';
    var good = [c1,c2,c3].filter(function(c){ return c==='good'; }).length;
    var v = w.querySelector('[data-g="verdict"]');
    v.textContent = good === 3 ? '3/3' : good + '/3';
    v.className = good === 3 ? 'good' : (good >= 2 ? 'warn' : 'bad');
  }
  chips.forEach(function(ch){
    ch.addEventListener('click', function(){
      var k = ch.getAttribute('data-fix');
      on[k] = !on[k];
      ch.classList.toggle('on', on[k]);
      compute();
    });
  });
  compute();
})();

              '<div class="t">Do Tatr jesienią sprawdzą się buty za kostkę z membraną…</div>' +

    }
    ROWS.forEach(function(r,i){
      html += '<div class="w-serp-row'+(ai && i<2 ? ' dim' : '')+'"><span class="u">'+esc(r[0])+'</span>' +

    w.querySelector('[data-s="ctr"]').className = ai ? 'warn' : 'good';
    w.querySelector('[data-s="visits"]').textContent = Math.round(ctr*100);
    w.querySelector('[data-s="trans"]').textContent = ai ? '−10%' : '—';
  }
  w.querySelectorAll('[data-serp]').forEach(function(btn){
    btn.addEventListener('click', function(){
      w.querySelectorAll('[data-serp]').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      draw(btn.getAttribute('data-serp') === 'on');
    });
  });
  draw(false);
})();

/* --- 2d. scenariusz automatyzacji --- */
(function(){
  var w = document.querySelector('[data-w="flow"]');
  if(!w) return;
  var host = w.querySelector('[data-flow]');
  var status = w.querySelector('[data-flow-status]');
  var runBtn = w.querySelector('[data-run]');
  var STEPS = [
    ['01','Formularz','lead trafia z reklamy'],
    ['02','Walidacja','e-mail, telefon, duplikat'],
    ['03','Wzbogacenie','branża, wielkość firmy'],
    ['04','CRM','karta + źródło + budżet'],
    ['05','Handlowiec','powiadomienie na Slacku'],
    ['06','Sekwencja','potwierdzenie i materiały']
  ];
  var nodes = [];
  STEPS.forEach(function(s,i){
    if(i>0){ var ar = document.createElement('div'); ar.className='w-arrow'; ar.textContent='›'; host.appendChild(ar); }
    var n = document.createElement('div');
    n.className = 'w-node';
    n.innerHTML = '<span class="n">'+s[0]+' · '+esc(s[1])+'</span><span class="v">'+esc(s[2])+'</span>';
    host.appendChild(n); nodes.push(n);
  });
  var leads = 0, busy = false;
  function set(k,v){ w.querySelector('[data-fl="'+k+'"]').textContent = v; }
  runBtn.addEventListener('click', function(){
    if(busy) return;
    busy = true; runBtn.disabled = true;
    var i = 0;
    status.textContent = 'Lead w obiegu…';
    (function step(){
      nodes.forEach(function(n,k){ n.classList.toggle('hot', k === i); });
      var arrows = host.querySelectorAll('.w-arrow');
      arrows.forEach(function(a,k){ a.classList.toggle('hot', k < i); });
      i++;
      if(i <= nodes.length){ setTimeout(step, REDUCED ? 10 : 340); return; }
      nodes.forEach(function(n){ n.classList.remove('hot'); });
      leads++;
      set('leads', leads);
      set('manual', (leads*9) + ' min');
      set('auto', (leads*12) + ' s');
      status.textContent = 'Gotowe · handlowiec ma powiadomienie';
      busy = false; runBtn.disabled = false;
    })();
  });
})();

/* --- 2f. test hooków --- */
(function(){
  var w = document.querySelector('[data-w="hooks"]');
  if(!w) return;
  var HOOKS = [
    ['„Kupiłem to zamiast droższego modelu. Oto co się stało."', 'historia', 42],
    ['3 błędy, przez które płacisz 30% więcej', 'liczba', 38],
    ['Rozkręcamy to na stole — bez montażu', 'demo', 47],
    ['Klientka pyta: czy warto dopłacić?', 'pytanie', 33],
    ['Nagranie z magazynu o 6 rano', 'ugc', 44],
    ['Tanio vs. drogo — ten sam test', 'kontrast', 40]
  ];
  var host = w.querySelector('[data-hooks]');
  var chart = w.querySelector('[data-hook-chart]');
  var axis = w.querySelector('[data-hook-axis]');
  var picked = [0,2,4];
  HOOKS.forEach(function(h,i){
    var b = document.createElement('button');
    b.className = 'w-hook' + (picked.indexOf(i) >= 0 ? ' on' : '');
    b.innerHTML = '<span class="txt">'+esc(h[0])+'</span><span class="score">'+h[2]+'%</span>';
    b.addEventListener('click', function(){
      var at = picked.indexOf(i);
      if(at >= 0) picked.splice(at,1); else picked.push(i);
      b.classList.toggle('on', at < 0);
      update();
    });
    host.appendChild(b);
  });
  function update(){
    chart.innerHTML = ''; axis.innerHTML = '';
    var sel = picked.slice().sort(function(a,b){ return a-b; });
    var max = 50;
    sel.forEach(function(i){
      var col = document.createElement('div'); col.className='w-col';
      var bar = document.createElement('div'); bar.className='bar';
      bar.style.height = (HOOKS[i][2]/max*100).toFixed(0)+'%';
      if(HOOKS[i][2] >= 44) bar.classList.add('hi');
      col.appendChild(bar); chart.appendChild(col);
      var sp = document.createElement('span'); sp.textContent = 'H'+(i+1); axis.appendChild(sp);
    });
    var types = {};
    sel.forEach(function(i){ types[HOOKS[i][1]] = 1; });
    var uniq = Object.keys(types).length;
    w.querySelector('[data-h="count"]').textContent = sel.length;
    var dv = w.querySelector('[data-h="div"]');
    var ratio = sel.length ? uniq/sel.length : 0;
    dv.textContent = sel.length < 3 ? 'za mało' : (ratio > 0.85 ? 'wysoka' : (ratio > 0.6 ? 'średnia' : 'niska'));
    dv.className = sel.length < 3 ? 'bad' : (ratio > 0.85 ? 'good' : (ratio > 0.6 ? 'warn' : 'bad'));
    var best = sel.slice().sort(function(a,b){ return HOOKS[b][2]-HOOKS[a][2]; })[0];
    w.querySelector('[data-h="best"]').textContent = best === undefined ? '—' : ('H'+(best+1)+' · '+HOOKS[best][2]+'%');
  }
  update();
})();

    if(idx < 0 || built[route]) return;

    var a = EDU[idx];

    var page = document.createElement('div');

    page.setAttribute('data-title', a.title + ' · Kliqa');
    page.hidden = true;
    page.innerHTML =
      '<section class="page-head"><div class="wrap">' +
        '<a class="back-link" href="#/edukacja">← Edukacja</a>' +
        '<p class="eyebrow"><span class="b">[</span> '+esc(a.badge)+' · '+esc(a.year)+' <span class="b">]</span></p>' +
        '<h1 class="display" style="margin-top:20px;font-size:clamp(34px,5.2vw,60px)">'+esc(a.title)+'</h1>' +
        '<p class="lead">'+esc(a.lead)+'</p>' +
        '<div class="page-meta"><span>Źródło: '+esc(a.source)+'</span><span>Omówienie: Kliqa</span></div>' +
      '</div></section>' +
      '<section class="sec wrap"><div class="art">' +
        '<div class="art-body rv">' +
          a.sections.map(function(s){
            return '<h2>'+esc(s[0])+'</h2>' + s[1].map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('');
          }).join('') +
          '<h2>Co z tego bierzemy do pracy</h2><ul>' +
          a.takeaways.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('') + '</ul>' +
          '<div class="art-foot">' +
            '<a class="btn btn-ghost" href="'+a.url+'" target="_blank" rel="noopener noreferrer">Przeczytaj oryginał ↗</a>' +
            '<a class="btn btn-line" href="#/edukacja/'+next.slug+'">Następny materiał: '+esc(next.title)+' <span class="ar">→</span></a>' +
          '</div>' +
        '</div>' +
        '<aside class="art-aside">' +
          '<div class="art-nums"><h3>Liczby, które warto zapamiętać</h3>' +
            a.numbers.map(function(n){ return '<div class="art-num"><b>'+esc(n[0])+'</b><span>'+esc(n[1])+'</span></div>'; }).join('') +
          '</div>' +

            '<a class="btn btn-line" href="'+a.url+'" target="_blank" rel="noopener noreferrer" style="width:100%;justify-content:center">Otwórz publikację ↗</a>' +
          '</div>' +

/* ============================================================ 4. FORMULARZ */
(function(){
  var block = document.createElement('div');
  block.id = 'ctBlock';
  block.innerHTML =
    '<form id="ctForm" novalidate>' +
      '<div class="f-row">' +
        '<div class="field"><label for="f-name">Imię i nazwisko *</label><input id="f-name" type="text" placeholder="Anna Kowalska" autocomplete="name" required></div>' +
        '<div class="field"><label for="f-company">Firma</label><input id="f-company" type="text" placeholder="Nazwa firmy" autocomplete="organization"></div>' +
      '</div>' +
      '<div class="f-row">' +
        '<div class="field"><label for="f-email">E-mail *</label><input id="f-email" type="email" placeholder="anna@firma.pl" autocomplete="email" required></div>' +
        '<div class="field"><label for="f-phone">Telefon</label><input id="f-phone" type="tel" placeholder="+48 600 000 000" autocomplete="tel"></div>' +
      '</div>' +
      '<div class="field"><label>Zakres współpracy</label><div class="scope" id="scope">' +
        ['Performance marketing','Strona / sklep','SEO','Automatyzacja','AI','Social media'].map(function(s){
          return '<label><input type="checkbox" value="'+s+'"><span>'+s+'</span></label>';
        }).join('') +
      '</div></div>' +
      '<div class="field"><label for="f-site">Adres strony</label><input id="f-site" type="text" placeholder="twojafirma.pl"></div>' +
      '<div class="field"><label for="f-msg">Opis *</label>' +
        '<textarea id="f-msg" placeholder="Sprzedajemy meble w Polsce i Czechach. ROAS spadł z 6 do 3,2 w pół roku, nie wiemy dlaczego." required></textarea></div>' +
      '<input type="text" id="f-hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">' +
      '<label class="consent"><input type="checkbox" id="f-rodo" required><span>Zgadzam się na kontakt w sprawie mojego zapytania. Administratorem danych jest Kliqa; dane przetwarzamy wyłącznie w celu odpowiedzi na to zgłoszenie.</span></label>' +
      '<div class="f-foot"><button class="btn btn-fill" type="submit">Wyślij zapytanie <span class="ar">→</span></button><span class="mono">→ biuro@kliqa.pl</span></div>' +
      '<p class="f-err" id="ctErr" role="alert"></p>' +
    '</form>' +
    '<div class="f-ok" id="ctOk" role="status">' +
      '<h3>Wiadomość gotowa do wysyłki</h3>' +
      '<p>Otworzyliśmy Twój program pocztowy z gotową treścią. Jeśli nic się nie otworzyło, skopiuj poniższy tekst i wyślij go na <b style="color:var(--lime)">biuro@kliqa.pl</b>.</p>' +
      '<pre id="ctPreview"></pre>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
        '<button class="btn btn-ghost" type="button" id="ctCopy">Skopiuj treść</button>' +
        '<button class="btn btn-line" type="button" id="ctBack">Wróć do formularza</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(block);

  var form = block.querySelector('#ctForm'), errEl = block.querySelector('#ctErr');
  var okBox = block.querySelector('#ctOk'), preview = block.querySelector('#ctPreview');
  var okTitle = okBox.querySelector('h3'), okText = okBox.querySelector('p');
  var copyBtn = block.querySelector('#ctCopy');
  /* Pusty adres = brak backendu (podgląd), wtedy działa tylko ścieżka mailto. */
  var MAIL_ENDPOINT = "__MAIL_ENDPOINT__";
  block.querySelectorAll('#scope input').forEach(function(inp){
    inp.addEventListener('change', function(){ inp.parentNode.classList.toggle('on', inp.checked); });
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var v = function(id){ var el = block.querySelector('#'+id); return (el.value||'').trim(); };
    var name=v('f-name'), email=v('f-email'), msg=v('f-msg');
    if(!name){ errEl.textContent='Podaj imię i nazwisko — chcemy wiedzieć, do kogo piszemy.'; block.querySelector('#f-name').focus(); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ errEl.textContent='Sprawdź adres e-mail — na ten adres wyślemy odpowiedź.'; block.querySelector('#f-email').focus(); return; }
    if(msg.length<10){ errEl.textContent='Opisz krótko, nad czym pracujesz (minimum kilka słów).'; block.querySelector('#f-msg').focus(); return; }
    if(!block.querySelector('#f-rodo').checked){ errEl.textContent='Potrzebujemy zgody na kontakt, żeby móc odpisać.'; return; }
    errEl.textContent='';
    var scope = Array.prototype.slice.call(block.querySelectorAll('#scope input:checked')).map(function(i){ return i.value; });
    var body =
      'Nowe zapytanie ze strony kliqa.pl\n--------------------------------\n' +
      'Imię i nazwisko: ' + name + '\nFirma: ' + (v('f-company')||'—') + '\nE-mail: ' + email +
      '\nTelefon: ' + (v('f-phone')||'—') + '\nStrona: ' + (v('f-site')||'—') +
      '\nZakres: ' + (scope.length?scope.join(', '):'—') +
      '\n--------------------------------\n' + msg + '\n';
    preview.textContent = 'Do: biuro@kliqa.pl\nTemat: Zapytanie ze strony — ' + name + '\n\n' + body;

    function openPanel(){
      form.style.display='none';
      okBox.classList.add('show');
      okBox.scrollIntoView({behavior: REDUCED?'auto':'smooth', block:'center'});
    }
    /* Bez endpointu (podgląd bez serwera) albo gdy wysyłka padnie: składamy gotową
       wiadomość i otwieramy program pocztowy, z kopiowaniem treści jako zapasem. */
    function mailtoFallback(note){
      okTitle.textContent = 'Wiadomość gotowa do wysyłki';
      okText.innerHTML = (note ? note + ' ' : '') +
        'Otworzyliśmy Twój program pocztowy z gotową treścią. Jeśli nic się nie otworzyło, ' +
        'skopiuj poniższy tekst i wyślij go na <b style="color:var(--lime)">biuro@kliqa.pl</b>.';
      preview.style.display = '';
      copyBtn.style.display = '';
      openPanel();
      var href = 'mailto:biuro@kliqa.pl?subject=' + encodeURIComponent('Zapytanie ze strony — ' + name) +
                 '&body=' + encodeURIComponent(body.slice(0,1600));
      try{ window.open(href, '_blank'); }catch(err){}
    }
    function sentOnServer(){
      okTitle.textContent = 'Wiadomość wysłana';
      okText.textContent = 'Dziękujemy — zgłoszenie trafiło na biuro@kliqa.pl. Odpowiadamy w ciągu ' +
        'jednego dnia roboczego, zwykle pytaniami o liczby.';
      preview.style.display = 'none';
      copyBtn.style.display = 'none';
      openPanel();
    }

    if(!MAIL_ENDPOINT){ mailtoFallback(''); return; }

    var payload = {
      name: name, company: v('f-company'), email: email, phone: v('f-phone'),
      site: v('f-site'), scope: scope, message: msg, consent: true, website: v('f-hp')
    };
    var btn = form.querySelector('button[type=submit]');
    var btnHtml = btn.innerHTML;
    btn.disabled = true; btn.textContent = 'Wysyłam…';
    fetch(MAIL_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, data: j }; }); })
      .then(function(res){
        if(!res.ok || !res.data || !res.data.ok) throw new Error((res.data && res.data.error) || 'Nie udało się wysłać.');
        sentOnServer();
      })
      .catch(function(){
        mailtoFallback('Serwer pocztowy nie odpowiedział, więc idziemy okrężną drogą:');
      })
      .then(function(){ btn.disabled = false; btn.innerHTML = btnHtml; });
  });
  block.querySelector('#ctBack').addEventListener('click', function(){
    okBox.classList.remove('show'); form.style.display='flex';
    preview.style.display = ''; copyBtn.style.display = '';
  });
  block.querySelector('#ctCopy').addEventListener('click', function(){
    var btn=this, txt=preview.textContent;
    var done=function(){ btn.textContent='Skopiowano ✓'; setTimeout(function(){ btn.textContent='Skopiuj treść'; },1800); };
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ btn.textContent='Skopiuj ręcznie'; }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
  });
})();

/* ============================================================ 5. START */
K.onRouteChange = function(){ K.registerReveal(); };
K.render(null);
K.onScroll();
})();
</script>
